name: Idea / Предложить идею
description: Suggest a feature or an improvement / Предложи функцию или улучшение
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see? / Чего тебе не хватает?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why do you need it? / Зачем это нужно?
      description: A short example of how you would use it. / Короткий пример, как бы ты этим пользовался.
